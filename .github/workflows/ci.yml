name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Syntax & py_compile
        run: |
          python -m py_compile src/finest_computer_use/*.py
          python -m py_compile scripts/*.py
          python -m py_compile tests/*.py

      - name: Run Intent/Effect Firewall Regression Suite (35 tests)
        run: |
          python tests/run_firewall_regression.py

      - name: Run Firewall Healthcheck (30 checks)
        run: |
          python scripts/firewall_healthcheck.py

      - name: Run Clean-Machine Lifecycle & Onboarding Tests (31 tests)
        run: |
          python tests/test_fresh_install.py

      - name: Run System Doctor CLI Check
        run: |
          python scripts/doctor.py --json || true
